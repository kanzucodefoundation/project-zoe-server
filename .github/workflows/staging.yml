name: Build and deploy Project Zoe Staging server

on:
  push:
    branches: [ develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: volta-cli/action@v1
        with:
          node-version: '18.x'
          npm-version: '8.x'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --forceExit

      - name: Create .env file
        env:
          PORT: ${{ secrets.STAGING_PORT }}
          DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          DB_PORT: ${{ secrets.STAGING_DB_PORT }}
          DB_DATABASE: ${{ secrets.STAGING_DB_DATABASE }}
          MAPS_URL: ${{ secrets.STAGING_MAPS_URL }}
          MAPS_KEY: ${{ secrets.STAGING_MAPS_KEY }}
          APP_URL: ${{ secrets.STAGING_APP_URL }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.STAGING_POSTMARK_SERVER_TOKEN }}
          POSTMARK_MESSAGE_STREAM: ${{ secrets.STAGING_POSTMARK_MESSAGE_STREAM }}
          EMAIL_SENDER: ${{ secrets.STAGING_EMAIL_SENDER }}
        run: |
          cat > .env << EOF
          PORT=$PORT
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_DATABASE=$DB_DATABASE
          DB_SYNCHRONIZE=false
          MAPS_URL=$MAPS_URL
          MAPS_KEY=$MAPS_KEY
          APP_URL=$APP_URL
          POSTMARK_SERVER_TOKEN=$POSTMARK_SERVER_TOKEN
          POSTMARK_MESSAGE_STREAM=$POSTMARK_MESSAGE_STREAM
          EMAIL_SENDER=$EMAIL_SENDER
          DATABASE_URL=postgresql://$DB_USERNAME:$DB_PASSWORD@$DB_HOST:$DB_PORT/$DB_DATABASE?schema=public
          EOF

      - name: Build
        run: DISABLE_ESLINT_PLUGIN=true npm run build

      - name: Archive npm failure logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: npm-logs
          path: ~/.npm/_logs

      - name: Open firewall for GitHub runner
        id: firewall-open
        env:
          SERVER_CLIENT_ID: ${{ secrets.SERVER_CLIENT_ID }}
          SERVER_CLIENT_SECRET: ${{ secrets.SERVER_CLIENT_SECRET }}
          SERVER_API_USER: ${{ secrets.SERVER_API_USER }}
          SERVER_API_PASSWORD: ${{ secrets.SERVER_API_PASSWORD }}
          FIREWALL_ID: ${{ secrets.FIREWALL_ID }}
        run: |
          set -e

          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"

          TOKEN=$(curl -s \
            -d "client_id=${SERVER_CLIENT_ID}" \
            -d "client_secret=${SERVER_CLIENT_SECRET}" \
            --data-urlencode "username=${SERVER_API_USER}" \
            --data-urlencode "password=${SERVER_API_PASSWORD}" \
            -d "grant_type=password" \
            'https://auth.contabo.com/auth/realms/contabo/protocol/openid-connect/token' \
            | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain Contabo access token"
            exit 1
          fi

          FIREWALL=$(curl -s \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "x-request-id: $(cat /proc/sys/kernel/random/uuid)" \
            "https://api.contabo.com/v1/firewalls/${FIREWALL_ID}")

          CURRENT_INBOUND=$(echo "${FIREWALL}" | jq '.data[0].rules.inbound // []')

          UPDATED_INBOUND=$(echo "${CURRENT_INBOUND}" | jq \
            --arg ip "${RUNNER_IP}/32" \
            'map(if .displayName == "GithubActionsCICD"
              then . + {"srcCidr": {"ipv4": [$ip], "ipv6": []}, "status": "active"}
              else .
              end)')

          PUT_BODY=$(jq -n --argjson inbound "$UPDATED_INBOUND" '{"rules": {"inbound": $inbound}}')

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "x-request-id: $(cat /proc/sys/kernel/random/uuid)" \
            -H "Content-Type: application/json" \
            -d "${PUT_BODY}" \
            "https://api.contabo.com/v1/firewalls/${FIREWALL_ID}")

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Failed to update firewall (HTTP ${HTTP_CODE})"
            exit 1
          fi

          echo "Firewall rule activated for ${RUNNER_IP}"

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SERVER_SSH_KEY" > ~/.ssh/projectzoe.key
          chmod 600 ~/.ssh/projectzoe.key
          cat >> ~/.ssh/config << EOF
          Host projectzoe-prod
            HostName $SERVER_HOST
            User $SERVER_USERNAME
            IdentityFile ~/.ssh/projectzoe.key
            StrictHostKeyChecking no
          EOF

      - name: Deploy dist
        run: rsync -rtvO --delete ./dist/ projectzoe-prod:/opt/projectzoe/staging/server/dist/

      - name: Deploy source
        run: rsync -rtvO --delete ./ projectzoe-prod:/opt/projectzoe/staging/server/raw/

      - name: Deploy node_modules
        run: rsync -rtvO --delete ./node_modules/ projectzoe-prod:/opt/projectzoe/staging/server/node_modules/

      - name: Deploy .env
        run: |
          rsync -rtvO ./.env projectzoe-prod:/opt/projectzoe/staging/server/
          rsync -rtvO ./.env projectzoe-prod:/opt/projectzoe/staging/server/dist/

      - name: Run database migrations
        run: ssh projectzoe-prod 'bash -l -c "cd /opt/projectzoe/staging/server/raw/ && npm run migration:run"'

      - name: Restart app
        run: ssh projectzoe-prod 'bash -l -c "cd /opt/projectzoe/staging/server/dist/ && pm2 delete zoeServerStaging 2>/dev/null || true && production=true pm2 start src/main.js --name zoeServerStaging"'

      - name: Close firewall
        if: always() && steps.firewall-open.conclusion == 'success'
        env:
          SERVER_CLIENT_ID: ${{ secrets.SERVER_CLIENT_ID }}
          SERVER_CLIENT_SECRET: ${{ secrets.SERVER_CLIENT_SECRET }}
          SERVER_API_USER: ${{ secrets.SERVER_API_USER }}
          SERVER_API_PASSWORD: ${{ secrets.SERVER_API_PASSWORD }}
          FIREWALL_ID: ${{ secrets.FIREWALL_ID }}
        run: |
          TOKEN=$(curl -s \
            -d "client_id=${SERVER_CLIENT_ID}" \
            -d "client_secret=${SERVER_CLIENT_SECRET}" \
            --data-urlencode "username=${SERVER_API_USER}" \
            --data-urlencode "password=${SERVER_API_PASSWORD}" \
            -d "grant_type=password" \
            'https://auth.contabo.com/auth/realms/contabo/protocol/openid-connect/token' \
            | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain Contabo access token for cleanup"
            exit 1
          fi

          FIREWALL=$(curl -s \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "x-request-id: $(cat /proc/sys/kernel/random/uuid)" \
            "https://api.contabo.com/v1/firewalls/${FIREWALL_ID}")

          CURRENT_INBOUND=$(echo "${FIREWALL}" | jq '.data[0].rules.inbound // []')

          UPDATED_INBOUND=$(echo "${CURRENT_INBOUND}" | jq \
            'map(if .displayName == "GithubActionsCICD"
              then . + {"status": "inactive"}
              else .
              end)')

          PUT_BODY=$(jq -n --argjson inbound "$UPDATED_INBOUND" '{"rules": {"inbound": $inbound}}')

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "x-request-id: $(cat /proc/sys/kernel/random/uuid)" \
            -H "Content-Type: application/json" \
            -d "${PUT_BODY}" \
            "https://api.contabo.com/v1/firewalls/${FIREWALL_ID}")

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Failed to close firewall (HTTP ${HTTP_CODE})"
            exit 1
          fi

          echo "Firewall rule deactivated for ${{ steps.firewall-open.outputs.runner_ip }}"
